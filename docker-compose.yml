services:
  udsctf:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: daedalus.local/0x02-udsctf-udsctf:latest
    cap_add:
    - NET_ADMIN
    - NET_RAW
    tmpfs:
    - /home/tester/work:rw,size=64m,uid=1000,gid=1000,mode=750
    environment:
      UDS_RESET_INTERVAL: '10800'
    ports:
    - '22:22'
